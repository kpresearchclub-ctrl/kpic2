<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>KP Innovation Club</title>

    <!-- Google Fonts -->
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>Photo Example</title>

    <style>
       
        .logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo img{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
}

.logo h2{
    font-size:24px;
    font-weight:700;
    color:white;
}
    </style>
</head>
<body>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#f5f7fb;
            color:#222;
            line-height:1.6;
        }

        a{
            text-decoration:none;
        }

        /* HEADER */

        header{
            background:#0b3d91;
            color:white;
            padding:15px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            position:sticky;
            top:0;
            z-index:1000;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .logo i{
            font-size:32px;
            color:#4fc3f7;
        }

        .logo h2{
            font-size:24px;
            font-weight:700;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:30px;
        }

        nav ul li a{
            color:white;
            font-weight:500;
            transition:0.3s;
        }

        nav ul li a:hover{
            color:#4fc3f7;
        }

        .join-btn{
            background:#4fc3f7;
            color:#0b3d91;
            padding:10px 22px;
            border-radius:30px;
            font-weight:600;
            transition:0.3s;
        }

        .join-btn:hover{
            background:white;
        }

        /* HERO SECTION */

        .hero{
    height:90vh;
    background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url('kpic back.png');

    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
}

        .hero-content{
            max-width:900px;
        }

        .hero-content h1{
            font-size:60px;
            margin-bottom:20px;
            font-weight:700;
        }

        .hero-content p{
            font-size:20px;
            margin-bottom:35px;
        }

        .hero-buttons{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
        }

        .btn{
            padding:14px 32px;
            border-radius:40px;
            font-size:16px;
            font-weight:600;
            transition:0.3s;
        }

        .primary-btn{
            background:#4fc3f7;
            color:#0b3d91;
        }

        .primary-btn:hover{
            background:white;
        }

        .secondary-btn{
            border:2px solid white;
            color:white;
        }

        .secondary-btn:hover{
            background:white;
            color:#0b3d91;
        }

        /* SECTION */

        section{
            padding:90px 8%;
        }

        .section-title{
            text-align:center;
            margin-bottom:60px;
        }

        .section-title h2{
            font-size:42px;
            color:#0b3d91;
            margin-bottom:10px;
        }

        .section-title p{
            color:#666;
        }

        /* ABOUT */

        .about{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(320px,1fr));
            gap:50px;
            align-items:center;
        }

        .about img{
            width:100%;
            border-radius:20px;
        }

        .about-text h3{
            color:#0b3d91;
            margin-bottom:20px;
            font-size:32px;
        }

        .about-text p{
            margin-bottom:20px;
            color:#555;
        }

        /* PROJECTS */

        .projects-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(280px,1fr));
            gap:30px;
        }

        .project-card{
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
            transition:0.3s;
        }

        .project-card:hover{
            transform:translateY(-10px);
        }

        .project-card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .project-content{
            padding:25px;
        }

        .project-content h3{
            color:#0b3d91;
            margin-bottom:10px;
        }

        /* STATISTICS */

        .stats{
            background:#0b3d91;
            color:white;
        }

        .stats-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:30px;
            text-align:center;
        }

        .stat-box h2{
            font-size:48px;
            margin-bottom:10px;
            color:#4fc3f7;
        }

        /* EVENTS */

        .event-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
            gap:30px;
        }

        .event-card{
            background:white;
            border-left:6px solid #0b3d91;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.06);
        }

        .event-card h3{
            color:#0b3d91;
            margin-bottom:15px;
        }

        /* TEAM */

        .team-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:30px;
        }

        .team-card{
            background:white;
            text-align:center;
            padding:30px;
            border-radius:20px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
        }

        .team-card img{
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
            margin-bottom:20px;
        }

        .team-card h3{
            color:#0b3d91;
        }

        /* CONTACT */

        .contact{
            background:#eef4ff;
            border-radius:25px;
            padding:60px;
        }

        .contact-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
            gap:40px;
        }

        .contact-info h3{
            color:#0b3d91;
            margin-bottom:20px;
        }

        .contact-info p{
            margin-bottom:15px;
        }

        form input,
        form textarea{
            width:100%;
            padding:15px;
            margin-bottom:20px;
            border:none;
            border-radius:10px;
            outline:none;
        }

        form button{
            background:#0b3d91;
            color:white;
            border:none;
            padding:14px 30px;
            border-radius:30px;
            cursor:pointer;
            font-weight:600;
        }

        /* FOOTER */

        footer{
            background:#081f4d;
            color:white;
            text-align:center;
            padding:25px;
        }

        footer p{
            font-size:15px;
        }

        /* RESPONSIVE */

        @media(max-width:900px){

            header{
                flex-direction:column;
                gap:20px;
            }

            nav ul{
                flex-wrap:wrap;
                justify-content:center;
            }

            .hero-content h1{
                font-size:42px;
            }

            .hero-content p{
                font-size:18px;
            }
        }

    </style>
</head>
