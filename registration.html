<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Registration - KP Innovation Club</title>

    <div class="logo">
   <a href="index.html"><img src="new designend log update.jpg" alt="KPIC Logo" width="25" height="25"></a>
    <h2>KP Innovation Club</h2>
        </div>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#f5f7fb;
            color:#222;
        }

        /* HEADER */

        header{
            background:#0b3d91;
            color:white;
            padding:18px 8%;
            text-align:center;
        }

        header h1{
            font-size:32px;
        }

        /* FORM SECTION */

        .container{
            width:90%;
            max-width:700px;
            margin:50px auto;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }

        .container h2{
            text-align:center;
            color:#0b3d91;
            margin-bottom:10px;
        }

        .container p{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-weight:500;
            color:#0b3d91;
        }

        .input-box input,
        .input-box select,
        .input-box textarea{
            width:100%;
            padding:15px;
            border:none;
            background:#f1f5ff;
            border-radius:10px;
            outline:none;
            font-size:15px;
        }

        textarea{
            resize:none;
        }

        button{
            width:100%;
            padding:15px;
            background:#0b3d91;
            color:white;
            border:none;
            border-radius:40px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#4fc3f7;
            color:#0b3d91;
        }

        .success-message{
            text-align:center;
            margin-top:20px;
            color:green;
            font-weight:600;
        }

        /* FOOTER */

        footer{
            background:#081f4d;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }

        @media(max-width:768px){

            .container{
                padding:25px;
            }

            header h1{
                font-size:24px;
            }

        }

    </style>
</head>
<body>

<!-- HEADER -->

<header>
    <h1>KP Innovation Club Registration</h1>
</header>

<!-- FORM SECTION -->

<div class="container">

    <h2>Student & Alumni Registration</h2>

    <p>
        Fill the form below to join KP Innovation Club.
    </p>

    <form id="registrationForm">

        <div class="input-box">
            <label>Full Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="input-box">
            <label>Email Address</label>
            <input type="email" id="email" required>
        </div>

        <div class="input-box">
            <label>Phone Number</label>
            <input type="tel" id="phone" required>
        </div>

        <div class="input-box">
            <label>Status</label>

            <select id="status" required>
                <option value="">Select Status</option>
                <option value="Student">Student</option>
                <option value="Alumni">Alumni</option>
            </select>
        </div>

        <div class="input-box">
            <label>Department</label>
            <input type="text" id="department" required>
        </div>

        <div class="input-box">
            <label>Academic Year</label>

            <select id="year" required>
                <option value="">Select Year</option>
                <option>Year 1</option>
                <option>Year 2</option>
                <option>Year 3</option>
                <option>Year 4</option>
            </select>
        </div>

        <div class="input-box">
            <label>Innovation Interest</label>

            <textarea id="interest" rows="5"
            placeholder="Describe your innovation interest"></textarea>
        </div>

        <button type="submit">
            Submit Registration
        </button>

        <div class="success-message" id="successMessage"></div>

    </form>

</div>

<!-- FOOTER -->

<footer>
    <p>
        © 2026 KP Innovation Club | All Rights Reserved
    </p>
</footer>

<!-- EMAILJS SCRIPT -->

<script>

    // Initialize EmailJS

    emailjs.init("fBuGkOe_ZYYmJycNu");

    // Form Submission

    document.getElementById("registrationForm")
    .addEventListener("submit", function(event){

        event.preventDefault();

        const templateParams = {

            full_name:
            document.getElementById("name").value,

            email:
            document.getElementById("email").value,

            phone:
            document.getElementById("phone").value,

            status:
            document.getElementById("status").value,

            department:
            document.getElementById("department").value,

            academic_year:
            document.getElementById("year").value,

            interest:
            document.getElementById("interest").value
        };

        emailjs.send(
            "service_nhi7u55",
            "template_eksqpgp",
            templateParams
        )

        .then(function(response){

            document.getElementById("successMessage")
            .innerHTML =
            "Registration submitted successfully!";

            document.getElementById("registrationForm")
            .reset();

        },

        function(error){

            alert("Failed to send registration.");

        });

    });

</script>

</body>
</html>
